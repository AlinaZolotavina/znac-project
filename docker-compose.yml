services:
  backend:
    restart: unless-stopped
    build: ./znac-api
    expose:
      - "4000"
    env_file:
      - ./znac-api/.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    restart: unless-stopped
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        REACT_APP_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
